<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - RedCicla</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        :root {
            /* Paleta sincronizada con base.html (Regla 60-30-10) */
            --color-bg-light: #f4f7f6;       /* 60% Fondo */
            --color-sidebar-combine: #1b4332; /* 30% Contraste Oscuro */
            --color-primary-green: #52b788;  /* 10% Acento Esmeralda */
            
            --color-bubble-bg: #ffffff;
            --color-text-main: #2b2d42;
            --color-red: #e76f51;
            
            --ios-bubble-radius: 24px;
            --ios-pill-radius: 16px;
        }

        body {
            /* Fondo limpio y profesional, sin degradados llamativos */
            background-color: var(--color-bg-light);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            color: var(--color-text-main);
        }

        /* La tarjeta flotante (Neumorfismo) */
        .login-card {
            max-width: 420px;
            width: 100%;
            border-radius: var(--ios-bubble-radius); 
            background-color: var(--color-bubble-bg);
            border: none;
            /* Sombra doble: Flotando sobre el fondo claro */
            box-shadow: 12px 12px 30px rgba(0, 0, 0, 0.05), 
                       -12px -12px 30px rgba(255, 255, 255, 0.9);
            padding: 40px 30px;
        }

        .brand-title {
            font-family: 'Poppins', sans-serif;
            color: var(--color-sidebar-combine);
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        .sub-panel-text {
            color: var(--color-primary-green);
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 2rem;
            display: block;
        }

        /* Inputs modernos tipo iOS */
        .custom-input {
            background-color: #f8f9fa !important;
            border: 1px solid rgba(27, 67, 50, 0.1) !important;
            border-radius: var(--ios-pill-radius) !important;
            color: var(--color-text-main) !important;
            font-weight: 500;
            padding: 14px 20px;
            transition: all 0.3s ease;
        }

        .custom-input:focus {
            background-color: #ffffff !important;
            border-color: var(--color-primary-green) !important;
            box-shadow: 0 0 0 4px rgba(82, 183, 136, 0.15) !important;
        }

        .custom-input::placeholder {
            color: #9ca3af;
            font-weight: 400;
        }

        .input-group-custom {
            position: relative;
            display: flex;
            align-items: center;
        }

        .btn-eye-inside {
            position: absolute;
            right: 15px;
            z-index: 10;
            background: none;
            border: none;
            color: #9ca3af;
            transition: color 0.2s ease;
        }

        .btn-eye-inside:hover {
            color: var(--color-primary-green);
        }

        /* Botón principal sincronizado con las microinteracciones */
        .btn-ingresar {
            background-color: var(--color-sidebar-combine) !important; /* Botón oscuro corporativo */
            border: none !important;
            border-radius: var(--ios-pill-radius) !important;
            color: #ffffff !important;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 1.1rem;
            padding: 12px;
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1) !important;
            box-shadow: 0 8px 20px rgba(27, 67, 50, 0.2);
        }

        .btn-ingresar:hover {
            background-color: #2d6a4f !important;
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(27, 67, 50, 0.3);
        }

        .btn-ingresar:active {
            transform: scale(0.97) translateY(0) !important;
            box-shadow: 0 2px 5px rgba(27, 67, 50, 0.2) !important;
        }

        /* Checkbox estilo iOS */
        .form-check-input {
            width: 18px;
            height: 18px;
            border-color: #cbd5e1;
            border-radius: 6px;
            cursor: pointer;
        }

        .form-check-input:checked {
            background-color: var(--color-primary-green);
            border-color: var(--color-primary-green);
        }
        
        .label-recuerdame {
            font-weight: 500;
            color: #64748b;
            font-size: 0.95rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="login-card mx-3">
        <div class="text-center">
            
            <div class="mb-2 d-flex flex-column align-items-center">
                <img src="{{ url_for('static', filename='images/LOGO_TEXTO_BELOW.png') }}" alt="Logo RedCicla" width="140" class="img-fluid mb-2"> 
            </div>

            <h2 class="brand-title">Bienvenido</h2>
            <span class="sub-panel-text">Panel de Administración</span>

            {% if error %}
            <div class="alert alert-danger py-2 small fw-bold mb-4" role="alert" style="border-radius: 12px; border: none; background-color: #ffedeb; color: var(--color-red);">
                <i class="bi bi-shield-exclamation me-1"></i> {{ error }}
            </div>
            {% endif %}

            <form action="/login" method="POST" class="text-start mt-4">
                
                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted mb-1 ps-1">Correo Electrónico</label>
                    <div class="input-group-custom">
                        <input type="email" name="correo" class="form-control custom-input" required placeholder="admin@redcicla.cl">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-bold text-muted mb-1 ps-1">Contraseña</label>
                    <div class="input-group-custom">
                        <input type="password" id="clave" name="clave" class="form-control custom-input" required placeholder="••••••••">
                        <button class="btn-eye-inside" type="button" id="btn-ojito" title="Mostrar/Ocultar contraseña">
                            <i class="bi bi-eye-fill fs-5" id="icono-ojito"></i>
                        </button>
                    </div>
                </div>

                <div class="form-check mb-4 d-flex align-items-center gap-2 ps-1">
                    <input class="form-check-input m-0" type="checkbox" id="recuerdame">
                    <label class="form-check-label label-recuerdame mt-1" for="recuerdame">
                        Mantener sesión iniciada
                    </label>
                </div>

                <button type="submit" class="btn btn-ingresar w-100 mt-2">
                    Ingresar al Sistema <i class="bi bi-arrow-right-short ms-1"></i>
                </button>
            </form>
            
        </div>
    </div>

    <script>
        const btnOjito = document.getElementById('btn-ojito');
        const inputClave = document.getElementById('clave');
        const iconoOjito = document.getElementById('icono-ojito');

        btnOjito.addEventListener('click', function () {
            const esPassword = inputClave.getAttribute('type') === 'password';
            inputClave.setAttribute('type', esPassword ? 'text' : 'password');
            
            iconoOjito.classList.toggle('bi-eye-fill');
            iconoOjito.classList.toggle('bi-eye-slash-fill');
        });
    </script>
</body>
</html>
